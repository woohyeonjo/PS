<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.5.2/dist/vue.js"></script>
</head>
<body>
    <div id="app">
        <child-component v-bind:childdata="message"></child-component>
        <sibling-component v-bind:siblingdata="anotherMessage"></sibling-component>
    </div>
    <script>
        Vue.component('child-component', {
            props: ['childdata'],
            template: '<p>{{childdata}}</p>'
        });

        Vue.component('sibling-component', {
            props: ['siblingdata'],
            template: '<p>{{siblingdata}}</p>'
        });

        let app = new Vue({
            el: '#app',
            data: {
                message: 'Hello Vue! passed from Parent Component, heading to child Component',
                anotherMessage: 'Hello Vue! passed from Parent Component, heading to sibling Component'
            }
        });
    </script>

</body>
</html>
