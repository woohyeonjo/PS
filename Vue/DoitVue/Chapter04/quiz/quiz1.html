<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.5.2/dist/vue.js"></script>
    <script src="https://unpkg.com/vue-router@3.0.1/dist/vue-router.js"></script>
</head>
<body>
<div id="app">
    <router-view name="header"></router-view>
    <router-view></router-view> <!-- name이 없는 경우는 디폴트 -->
    <router-view name="footer"></router-view>
</div>
<script>
    let Body = { template: '<div>This is Body</div>'};
    let Header = { template: '<div>This is Header</div>'};
    let Footer = { template: '<div>This is Footer</div>'};
    let LoginBody = { template: '<div>This is LoginBody</div>'};
    let LoginHeader = { template: '<div>This is LoginHeader</div>'};
    let LoginFooter = { template: '<div>This is LoginFooter</div>'};

    let router = new VueRouter({
        routes: [
            {
                path: '/',
                components: {
                    default: Body,
                    header: Header,
                    footer: Footer
                }
            },
            {
                path: '/login',
                components: {
                    default: LoginBody,
                    header: LoginHeader,
                    footer: LoginFooter
                }
            }
        ]
    });

    let app = new Vue({
        router
    }).$mount('#app');
</script>
</body>
</html>
