<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.5.2/dist/vue.js"></script>
</head>
<body>
    <div id="app">
        <h1> {{ name }} </h1>
        <p v-bind:id="uid">Trust me! I'm UI developer</p>
        <p v-if="flag">but, I'm Newbie</p>

        <div>
            <button v-on:click="clickBtnES6" style="display:inline-block">ES6</button>
            <button v-on:click="clickBtnES5" style="display:inline-block">ES5</button>
            <button v-on:click="eventMethod">HIDDEN SWITCH</button>
        </div>
    </div>
    <script>
        let app = new Vue({
            el: '#app',
            data: {
                message: 'Hello Vue.js!',
                name: 'Woohyeon Jo',
                uid: '10',
                flag: true
            },
            methods: {
                // ES6
                clickBtnES6() {
                    console.log("Hi ES6");
                },

                // ES5
                clickBtnES5: function () {
                    console.log("Hi ES5");
                },

                eventMethod() {
                    this.flag = this.flag ? false : true;
                }
            }
        });

    </script>
</body>
</html>
