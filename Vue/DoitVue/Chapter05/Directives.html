<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.5.2/dist/vue.js"></script>
</head>
<body>
    <div id="app">
        <a v-if="flag"> 두 잇 뷰 </a>
        <ul>
            <li v-for="system in systems"> {{system}} </li>
        </ul>
        <p v-show="flag">두 잇 뷰</p>
        <h5 v-bind:id="uid">뷰 입문서</h5>
        <button v-on:click="pupupAlert">경고 창 버튼</button>
    </div>

    <script>
        new Vue({
            el: '#app',
            data: {
                flag: true,
                systems: ['android', 'ios', 'window'],
                uid: 10
            },
            methods: {
                pupupAlert: function() {
                    return alert("경고 창 표시");
                }
            }
        });
    </script>
</body>
</html>
